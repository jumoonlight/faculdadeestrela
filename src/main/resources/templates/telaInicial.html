<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/telaInicial.css}">
    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/no1m7b.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <title>Tela Inicial</title>
</head>
<body>
    <header>
        <img src="https://files.catbox.moe/c5zojs.png" alt="Logo" width="200">
    </header>
    <div class="banner">
        <img src="https://files.catbox.moe/bhbx3t.png" alt="Banner" width="100%">
    </div>
    <article>
        <h1>Cadastros</h1>
        <div class="bloco">
            <div class="conteudo-um">
                <h2>Aluno</h2>
                <img src="https://files.catbox.moe/nblun5.png" alt="Aluno" width="200">
                <div class="botoes">
                      <form method="get" th:action="@{/formularioAluno}">
                            <button>Cadastrar Alunos</button>
                      </form>
                      <form method="get" th:action="@{/listarAlunos}">
                            <button>Consultar Alunos</button>
                      </form>
                </div>
            </div>
            <div class="conteudo-um">
                <h2>Professor</h2>
                <img src="https://files.catbox.moe/ylgzn3.jpg" alt="Professor" width="200">
                <div class="botoes">
                    <form method="get" th:action="@{/formularioProfessor}">
                            <button>Cadastrar Professores</button>
                      </form>
                      <form method="get" th:action="@{/listarProfessores}">
                            <button>Consultar Professores</button>
                      </form>
                </div>
            </div>
            <div class="conteudo-um">
                 <h2>Matrícula</h2>
                <img src="https://files.catbox.moe/gv1jtj.jpg" alt="Matrícula" width="200">
                <div class="botoes">
                    <form method="get" th:action="@{/formularioMatricula}">
                            <button>Matricular-se</button>
                      </form>
                      <form method="get" th:action="@{/listarMatriculas}">
                            <button>Consultar Matrículas</button>
                      </form>
                </div>
            </div>
        </div>
        <div class="bloco">
            <div class="conteudo-dois">
                <h2>Curso</h2>
                <img src="https://files.catbox.moe/2yt0x4.png" alt="Curso" width="200">
                <div class="botoes">
                    <form method="get" th:action="@{/formularioCurso}">
                            <button>Cadastrar Cursos</button>
                      </form>
                      <form method="get" th:action="@{/listarCursos}">
                            <button>Consultar Cursos</button>
                      </form>
                </div>
            </div>
            <div class="conteudo-dois">
                <h2>Disciplina</h2>
                <img src="https://files.catbox.moe/pb3ddk.png" alt="Disciplina" width="200">
                <div class="botoes">
                    <form method="get" th:action="@{/formularioDisciplina}">
                            <button>Cadastrar Disciplinas</button>
                      </form>
                      <form method="get" th:action="@{/listarDisciplinas}">
                            <button>Consultar Disciplinas</button>
                      </form>
                </div>
            </div>
            <div class="conteudo-dois">
                 <h2>Ofertas de Disciplinas</h2>
                 <img src="https://files.catbox.moe/8ms92v.jpg" alt="Ofertas Disciplinas" width="170">
                 <div class="botoes">
                    <form method="get" th:action="@{/formularioOfertaDisciplina}">
                            <button>Cadastrar Ofertas</button>
                      </form>
                      <form method="get" th:action="@{/listarOfertasDisciplina}">
                            <button>Consultar Ofertas</button>
                      </form>
                 </div>
            </div>
        </div>
    </article> 
    <footer>
        <p>Faculdade Estrela, fazendo o melhor por você.</p>
    </footer>
</body>
</html>

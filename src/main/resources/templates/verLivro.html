<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Livros</title>
    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/no1m7b.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tabelas.css}">
</head>
</head>
<body>
    <h1>Livros</h1>
    <div th:if="${livros.isEmpty()}" class="sem-resultados">
                <p class="sem-resultados">Nenhum livro encontrado.</p>
                <a th:href="@{/telainicial}" class="btn-voltar">Voltar para a tela inicial</a>
            </div>
    <div th:unless="${livros.isEmpty()}">
    <div th:if="${erro}" style="color: red; font-weight: bold;">
        <span th:text="${erro}"></span>
    </div>
    <table border="1px">
        <thead>
            <tr>
                <th>ID</th>
                <th>Título do Livro</th>
                <th>Autor do Livro</th>
                <th>Ano de Publicação do Livro</th>
                <th>Editora do Livro</th>
                <th>ISBN do Livro</th>
                <th>Número de páginas do Livro</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="livro : ${livros}">
                <td><span th:text="${livro.id}"></span></td>
                <td th:text="${livro.titulo}"></td>
                <td th:text="${livro.autor}"></td>
                <td th:text="${livro.anoPublicacao}"></td>
                <td th:text="${livro.editora}"></td>
                <td th:text="${livro.isbn}"></td>
                <td th:text="${livro.numPaginas}"></td>
                <td>
                      <a th:href="@{/livro/{id}(id=${livro.id})}" class="btn-tabela btn-ver">Ver Detalhes</a>
                      <a th:href="@{/livro/{id}/editar(id=${livro.id})}" class="btn-tabela btn-editar">Editar</a>
                      <a th:href="@{/livro/{id}/deletar(id=${livro.id})}" class="detalhes deletar">Remover</a>
                </td>
             </tr>
        </tbody>
    </table>
    <br>
    <form method="get" th:action="@{/telainicial}">
        <button>Voltar para a Tela Inicial</button>
    </form>
    </div>
</body>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cursos</title>
    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/no1m7b.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>
<body>
    <div class="conteudo">
        <div class="principal">
          <form method="post" th:action="@{/cadastrarCurso}">
             <h1>Cadastro de Cursos</h1>
             <label>Nome do Curso:</label>
             <input type="text" th:name="nome_curs" required>
             <label>Descrição do Curso: </label>
             <input type="text" th:name="desc_curs" required>
             <label>Turno: </label>
             <div class="opcao">
               <input type="radio" th:name="turno" value="Manhã" required>
               <label>Manhã</label>
             </div>
             <div class="opcao">
                <input type="radio" th:name="turno" value="Tarde" required>
                <label>Tarde</label>
             </div>
             <div class="opcao">
                <input type="radio" th:name="turno" value="Noite" required>
                <label>Noite</label>
             </div>
             <label>Número de Semestres: </label>
             <input type="number" th:name="num_sem_curso" required>
             <button type="submit">Cadastrar Curso</button>
             </form>
        </div>
</body>
</html>

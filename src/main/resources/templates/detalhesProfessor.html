<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Pessoa</title>
    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/no1m7b.png">
    <link rel="stylesheet" th:href="@{/css/detalhes.css}">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Detalhes do Professor</h1>
    <p>Nome: <span th:text="${professor.nome}"></span></p>
    <p>CPF: <span th:text="${professor.cpf}"></span></p>
    <p>Data de Nascimento: <span th:text="${professor.dataNasc}"></span></p>
    <p>E-mail: <span th:text="${professor.email}"></span></p>
    <p>Telefone: <span th:text="${professor.telefone}"></span></p>
    <p>Endereço: <span th:text="${professor.endereco}"></span></p>
    <p>Cidade: <span th:text="${professor.cidade}"></span></p>
    <p>CEP: <span th:text="${professor.cep}"></span></p>
    <p>UF: <span th:text="${professor.uf}"></span></p>
    <p>Siape: <span th:text="${professor.siape}"></span></p>
    <p>Área: <span th:text="${professor.area}"></span></p>
    <p>Formação: <span th:text="${professor.formacao}"></span></p>
    <br>
    <form method="get" th:action="@{/listarProfessores}">
        <button>Voltar para a tabela de Professores</button>
    </form>
</body>
</html>

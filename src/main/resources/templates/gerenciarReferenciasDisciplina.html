<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Referências da Disciplina</title>
    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/no1m7b.png">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tabelas.css}">
</head>
<body>
    <h1>Referências da Disciplina</h1>
    <p><strong>Disciplina:</strong> <span th:text="${disciplina.nome}"></span></p>

    <div th:if="${erro}" style="color: red; font-weight: bold;">
        <span th:text="${erro}"></span>
    </div>

    <form method="post" th:action="@{/disciplina/{id}/referencias/adicionar(id=${disciplina.id})}">
        <label>Adicionar livro de referência:</label>
        <br>
        <br>
        <select name="id_livro" required>
            <option value="">-- Selecione um livro --</option>
            <option th:each="l : ${livros}"
                    th:value="${l.id}"
                    th:text="${l.titulo + ' (' + l.autor + ')'}"></option>
        </select>
        <br>
        <br>
        <button type="submit">Adicionar</button>
    </form>

    <br>


    <div th:if="${referencias.isEmpty()}">
        <p>Nenhuma referência cadastrada ainda.</p>
    </div>

    <div th:unless="${referencias.isEmpty()}">
        <table border="1px">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Capa</th>
                    <th>Título do Livro</th>
                    <th>Autor</th>
                    <th>Editora</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${referencias}">
                    <td th:text="${r.id}"></td>
                     <td><img th:if="${r.livro.capa != null and !r.livro.capa.isEmpty()}" th:src="@{'/' + ${r.livro.capa}}" alt="Capa" style="width: 60px; height: auto;">
            <span th:unless="${r.livro.capa != null and !r.livro.capa.isEmpty()}">—</span>
        </td>
                    <td th:text="${r.livro.titulo}"></td>
                    <td th:text="${r.livro.autor}"></td>
                    <td th:text="${r.livro.editora}"></td>
                    <td>
                        <a th:href="@{/disciplina/{id}/referencias/{id_ref}/remover(id=${disciplina.id}, id_ref=${r.id})}"
                           class="detalhes deletar">Remover</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <br>
    <form method="get" th:action="@{/disciplina/{id}/referencias/finalizar(id=${disciplina.id})}">
        <button type="submit">Finalizar e voltar para a lista de Disciplinas</button>
    </form>
</body>
</html>

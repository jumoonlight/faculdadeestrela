<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Alunos</title>
    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/no1m7b.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tabelas.css}">
</head>
<body>
    <h1>Alunos</h1>
    <div th:if="${alunos.isEmpty()}" class="sem-resultados">
                <p class="sem-resultados">Nenhum aluno encontrado.</p>
                <a th:href="@{/telainicial}" class="btn-voltar">Voltar para a tela inicial</a>
            </div>
    <div th:unless="${alunos.isEmpty()}">
    <div th:if="${erro}" style="color: red; font-weight: bold;">
            <span th:text="${erro}"></span>
    </div>
    <table border="1px">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>Data de Nascimento</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th>Endereço</th>
                <th>Cidade</th>
                <th>CEP</th>
                <th>UF</th>
                <th>Prontuário</th>
                <th>Ano de ingresso</th>
                <th>Ano de saída</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="aluno : ${alunos}">
                <td><span th:text="${aluno.id}"></span></td>
                <td th:text="${aluno.nome}"></td>
                <td th:text="${aluno.cpf}"></td>
                <td th:text="${aluno.dataNasc}"></td>
                <td th:text="${aluno.email}"></td>
                <td th:text="${aluno.telefone}"></td>
                <td th:text="${aluno.endereco}"></td>
                <td th:text="${aluno.cidade}"></td>
                <td th:text="${aluno.cep}"></td>
                <td th:text="${aluno.uf}"></td>
                <td th:text="${aluno.prontuario}"></td>
                <td th:text="${aluno.ano_ingresso}"></td>
                <td th:text="${aluno.ano_saida}"></td>
                <td>
                      <a th:href="@{/aluno/{id}(id=${aluno.id})}" class="btn-tabela btn-ver">Ver Detalhes</a>
                      <a th:href="@{/aluno/{id}/editar(id=${aluno.id})}" class="btn-tabela btn-editar">Editar</a>
                      <a th:href="@{/aluno/{id}/deletar(id=${aluno.id})}" class="detalhes deletar">Remover</a>
                </td>
             </tr>
        </tbody>
    </table>
    <br>
    <form method="get" th:action="@{/telainicial}">
        <button>Voltar para a Tela Inicial</button>
    </form>
    </div>
</body>

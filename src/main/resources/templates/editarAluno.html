<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Aluno</title>
    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/no1m7b.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>
<body>
    <div class="conteudo">
        <div class="principal"></div>
          <form method="post" th:action="@{/atualizarAluno}">
             <h1>Editar Aluno</h1>
             <input type="hidden" name="id" th:value="${aluno.id}">
             <label>Nome:</label>
             <input type="text" th:name="nome" th:value="${aluno.nome}" required>
             <label>CPF: </label>
             <input type="text" th:name="cpf" th:value="${aluno.cpf}" required>
             <label>Data de Nascimento: </label>
             <input type="date" th:name="dataNascimento" th:value="${aluno.dataNasc}" required>
             <label>E-mail: </label>
             <input type="email" th:name="email" th:value="${aluno.email}" required>
             <label>Telefone: </label>
             <input type="text" th:name="telefone" th:value="${aluno.telefone}" required>
             <label>Endereço: </label>
             <input type="text" th:name="endereco" th:value="${aluno.endereco}" required>
             <label>Cidade: </label>
             <input type="text" th:name="cidade" th:value="${aluno.cidade}" required>
             <label>CEP: </label>
             <input type="text" th:name="cep" th:value="${aluno.cep}" required>
             <label>UF: </label>
             <select th:name="uf" required>
                <option value="">Selecione...</option>
                <option value="AC" th:selected="${aluno.uf == 'AC'}">AC</option>
                <option value="AP" th:selected="${aluno.uf == 'AP'}">AP</option>
                <option value="AM" th:selected="${aluno.uf == 'AM'}">AM</option>
                <option value="PA" th:selected="${aluno.uf == 'PA'}">PA</option>
                <option value="RO" th:selected="${aluno.uf == 'RO'}">RO</option>
                <option value="RR" th:selected="${aluno.uf == 'RR'}">RR</option>
                <option value="TO" th:selected="${aluno.uf == 'TO'}">TO</option>
                <option value="MT" th:selected="${aluno.uf == 'MT'}">MT</option>
                <option value="MS" th:selected="${aluno.uf == 'MS'}">MS</option>
                <option value="GO" th:selected="${aluno.uf == 'GO'}">GO</option>
                <option value="DF" th:selected="${aluno.uf == 'DF'}">DF</option>
                <option value="MA" th:selected="${aluno.uf == 'MA'}">MA</option>
                <option value="PI" th:selected="${aluno.uf == 'PI'}">PI</option>
                <option value="CE" th:selected="${aluno.uf == 'CE'}">CE</option>
                <option value="RN" th:selected="${aluno.uf == 'RN'}">RN</option>
                <option value="PB" th:selected="${aluno.uf == 'PB'}">PB</option>
                <option value="PE" th:selected="${aluno.uf == 'PE'}">PE</option>
                <option value="AL" th:selected="${aluno.uf == 'AL'}">AL</option>
                <option value="SE" th:selected="${aluno.uf == 'SE'}">SE</option>
                <option value="BA" th:selected="${aluno.uf == 'BA'}">BA</option>
                <option value="MG" th:selected="${aluno.uf == 'MG'}">MG</option>
                <option value="ES" th:selected="${aluno.uf == 'ES'}">ES</option>
                <option value="RJ" th:selected="${aluno.uf == 'RJ'}">RJ</option>
                <option value="SP" th:selected="${aluno.uf == 'SP'}">SP</option>
                <option value="PR" th:selected="${aluno.uf == 'PR'}">PR</option>
                <option value="SC" th:selected="${aluno.uf == 'SC'}">SC</option>
                <option value="RS" th:selected="${aluno.uf == 'RS'}">RS</option>
            </select>
            <label>Prontuário:</label>
            <input type="text" th:name="pront" th:value="${aluno.prontuario}" required>
            <label>Ano de ingresso: </label>
            <input type="number" th:name="ano_ingresso" th:value="${aluno.ano_ingresso}" required>
            <label>Ano de saída: </label>
            <input type="number" th:name="ano_saida" th:value="${aluno.ano_saida}" required>
            <button type="submit">Editar Aluno</button>
          </form>
        </div>
</body>
</html>

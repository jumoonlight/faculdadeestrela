<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Disciplina</title>
    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/no1m7b.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>
<body>
    <div class="conteudo">
        <div class="principal"></div>
          <form method="post" th:action="@{/atualizarDisciplina}">
             <h1>Editar Disciplina</h1>
             <input type="hidden" name="id" th:value="${disciplina.id}">
             <label>Nome da Disciplina:</label>
             <input type="text" th:name="nome" th:value="${disciplina.nome}" required>
             <label>Descrição da Disciplina: </label>
             <input type="text" th:name="desc" th:value="${disciplina.desc}" required>
             <label>Número de Semestres: </label>
             <input type="number" th:name="num_sem_disc" th:value="${disciplina.numeroSemestres}" required>
             <label>Carga Horária: </label>
             <input type="number" th:name="carga_horaria" th:value="${disciplina.cargaHoraria}" required>
             <button type="submit">Editar Disciplina</button>
          </form>
        </div>
</body>
</html>

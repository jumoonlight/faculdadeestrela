<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/no1m7b.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cabecalho.css}">
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
    <script th:src="@{/js/script.js}"></script>
    <script src="https://kit.fontawesome.com/70d231ef29.js" crossorigin="anonymous"></script>
    
</head>
<body>
    <div th:replace="fragments/cabecalho :: cabecalho"></div>
    <div class="conteudo">
          <form method="post" th:object="${aluno}" th:action="@{/aluno/salvar}" >
             <h1>Cadastro de Aluno</h1>

               <input type="hidden" th:field="*{idAluno}">
             
                <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
             <div th:if="${erro}" style="color: red; font-weight: bold;">
                <span th:text="${erro}"></span>
             </div>
             
             <label>Nome:</label>
             <input type="text"  th:field="*{nome}" th:name="nome" required>
             <label>CPF: </label>
             <input type="text" th:field="*{cpf}" required>
             <label>Data de Nascimento: </label>
             <input type="date" th:name="dataNascimento" required>
             <label>E-mail: </label>
             <input type="email" th:field="*{email}"  required>
             <label>Telefone: </label>
             <input type="tel" th:field="*{telefone}"  required>
             <label>Endereço: </label>
             <input type="text" th:field="*{endereco}"  required>
             <label>Cidade: </label>
             <input type="text" th:field="*{cidade}"  required>
             <label>CEP: </label>
             <input type="text" th:field="*{cep}"  required>
             <label>Nome da mãe: </label>
             <input type="text" th:field="*{nomeMae}"  required>
             <label>Nome do pai: </label>
             <input type="text" th:field="*{nomePai}"  required>
             <label>Contato do Responsável (caso o aluno seja menor de idade) </label>
             <input type="text" th:field="*{contatoResponsavel}" >
             <label>UF: </label>
             <select th:name="uf" required>
                <option>AC</option>
                <option>AP</option>
                <option>AM</option>
                <option>PA</option>
                <option>RO</option>
                <option>RR</option>
                <option>TO</option>
                <option>MT</option>
                <option>MS</option>
                <option>GO</option>
                <option>DF</option>
                <option>MA</option>
                <option>PI</option>
                <option>CE</option>
                <option>RN</option>
                <option>PB</option>
                <option>PE</option>
                <option>AL</option>
                <option>SE</option>
                <option>BA</option>
                <option value="MG">MG</option>
                <option value="ES">ES</option>
                <option value="RJ">RJ</option>
                <option value="SP">SP</option>
                <option value="PR">PR</option>
                <option value="SC">SC</option>
                <option value="RS">RS</option>
             </select>
             <label>Prontuário:</label>
             <input type="text" th:field="*{prontuario}"  required>
             <label>Ano de ingresso: </label>
             <input type="number" th:field="*{anoIngresso}"  required>
             <label>Ano de saída: </label>
             <input type="number" th:field="*{anoSaida}" >
          
                    <label>Curso</label>
                    <select class="form-select"  th:field="*{idCurso}" required>
                        <option value="">Selecione</option>
                        <option th:each="curso : ${cursos}" th:value="${curso.idCurso}" th:text="${curso.nome}"></option>
                    </select>

                   <label>Senha: </label>
             <div class="senha">
               <input type="password" th:name="password"  id="password" required>
               <i class="fa-solid fa-eye" id="btn-password" onclick="mostrarSenha()"></i>
             </div>
               
             <button type="submit">Cadastrar Aluno</button>
             </form>
                </div>
            

        </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Ofertas de Disciplinas</title>
    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/no1m7b.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tabelas.css}">
</head>
<body>
    <h1>Ofertas de Disciplinas</h1>
    <div th:if="${ofertas.isEmpty()}" class="sem-resultados">
                <p class="sem-resultados">Nenhuma oferta foi encontrada.</p>
                <a th:href="@{/telainicial}" class="btn-voltar">Voltar para a tela inicial</a>
    </div>
    <div th:unless="${ofertas.isEmpty()}">
    <div th:if="${erro}" style="color: red; font-weight: bold;">
        <span th:text="${erro}"></span>
    </div>
    <table border="1px">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome do Professor</th>
                <th>Nome do Curso</th>
                <th>Nome da Disciplina</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="oferta : ${ofertas}">
                <td><span th:text="${oferta.id}"></span></td>
                <td th:text="${oferta.professor.nome}"></td>
                <td th:text="${oferta.curso.nome}"></td>
                <td th:text="${oferta.disciplina.nome}"></td>
                <td>
                      <a th:href="@{/oferta/{id}(id=${oferta.id})}" class="btn-tabela btn-ver">Ver Detalhes</a>
                      <a th:href="@{/oferta/{id}/editar(id=${oferta.id})}" class="btn-tabela btn-editar">Editar</a>
                      <a th:href="@{/oferta/{id}/deletar(id=${oferta.id})}" class="detalhes deletar">Remover</a>
                </td>
             </tr>
        </tbody>
    </table>
    <br>
    <form method="get" th:action="@{/telainicial}">
        <button>Voltar para a Tela Inicial</button>
    </form>
    </div>
</body>

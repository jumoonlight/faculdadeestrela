<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Ofertas de Disciplinas</title>
    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/no1m7b.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tabelas.css}">
    <link rel="stylesheet" th:href="@{/css/cabecalho.css}">
    <script th:src="@{/js/script.js}"></script>
</head>
<body>
    <div th:replace="fragments/cabecalho :: cabecalho"></div>
    <h1>Ofertas de Disciplinas</h1>
    <div th:if="${ofertas.isEmpty()}" class="sem-resultados">
                <p class="sem-resultados">Nenhuma oferta foi encontrada.</p>
                <a th:href="@{/telainicial}" class="btn-voltar">Voltar para a tela inicial</a>
    </div>
    <div th:unless="${ofertas.isEmpty()}">
    <div th:if="${erro}" style="color: red; font-weight: bold;">
        <span th:text="${erro}"></span>
    </div>

    <form th:action="@{/ofertadisciplina/listar}" method="get" class="d-flex align-items-center gap-1">
                <select name="idDisciplina" class="form-select filtro-select" onchange="this.form.submit()">
                    <option value="">Todas disciplinas</option>
                    <option th:each="disciplina : ${disciplinas}"
                            th:value="${disciplina.idDisciplina}"
                            th:text="${disciplina.nome}"
                            th:selected="${disciplina.idDisciplina == idDisciplinaFiltro}">
                    </option>
                </select>
            </form>
    
        <form th:action="@{/ofertadisciplina/listar}" method="get" class="d-flex align-items-center gap-1">
                <select name="idProfessor" class="form-select filtro-select" onchange="this.form.submit()">
                    <option value="">Todos professores</option>
                    <option th:each="professor : ${professores}"
                            th:value="${professor.idProfessor}"
                            th:text="${professor.nome}"
                            th:selected="${professor.idProfessor == idProfessorFiltro}">
                    </option>
                </select>
        </form>

    <table border="1px">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome da Disciplina</th>
                <th>Nome do Professor</th>
                <th>Nome do Curso</th>
                <th>Ano</th>
                <th>Semestre</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="oferta : ${ofertas}">
                <td><span th:text="${oferta.id}"></span></td>
                <td th:text="${oferta.disciplina.nome}"></td>
                 <td th:text="${oferta.professor.nome}"></td>
                <td th:text="${oferta.curso.nome}"></td>
                 <td th:text="${oferta.ano}"></td>
                  <td th:text="${oferta.semestre}"></td>
                <td>
                      <a th:href="@{/oferta/{id}(id=${oferta.id})}" class="btn-tabela btn-ver">Ver Detalhes</a>
                      <a th:href="@{/oferta/{id}/editar(id=${oferta.id})}" class="btn-tabela btn-editar">Editar</a>
                      <a th:href="@{/oferta/{id}/deletar(id=${oferta.id})}" class="detalhes deletar">Remover</a>
                </td>
             </tr>
        </tbody>
    </table>
    <br>
    <form method="get" th:action="@{/telainicial}">
        <button>Voltar para a Tela Inicial</button>
    </form>
    </div>
</body>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de empréstimos</title>
    <link rel="icon" type="image/x-icon" href="https://files.catbox.moe/no1m7b.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
    <link rel="stylesheet" th:href="@{/css/cabecalho.css}">
    <script th:src="@{/js/script.js}"></script>
</head>
<body>
    <div th:replace="fragments/cabecalho :: cabecalho"></div>
    <div class="conteudo">
        <div class="principal">
          <form method="post" th:action="@{/cadastrarEmprestimo}">

        
             <h1>Cadastrar Empréstimos</h1>
             <div th:if="${erro}" style="color: red; font-weight: bold;">
             <span th:text="${erro}"></span>
            </div>
             <label>Data de Empréstimo: </label>
             <input type="date" name="data_emprestimo" required>

          <div sec:authorize="hasAnyRole('ADMIN','BIBLIOTECARIO')">
            <div th:replace="fragments/selecionarPessoa :: selecionarPessoa(null, null, false)"></div>
        </div>
        
              <label> Livro: </label> 
             <select name="id_livro" required>
                    <option value="">Selecione o título do livro: </option>
                    <option th:each="livro : ${livros}" th:value="${livro.id}" th:text="${livro.titulo}"></option>
             </select>
             <button type="submit">Cadastre o Emprétimo</button>
             </form>
        

             </div>
           
        </div>
    
</body>
</html>
